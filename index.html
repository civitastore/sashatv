<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sasha TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        #app {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        #sidebar {
            width: 320px;
            height: 100%;
            background: #121212;
            border-right: 2px solid #222;
            display: flex;
            flex-direction: column;
        }
        #title {
            padding: 20px;
            font-weight: bold;
            font-size: 20px;
            background: #1e1e1e;
            text-align: center;
            color: #00d4ff;
            letter-spacing: 1px;
        }
        #channel-list {
            flex: 1;
            overflow-y: auto;
        }
        .channel-btn {
            padding: 16px 20px;
            border: none;
            border-bottom: 1px solid #222;
            cursor: pointer;
            font-size: 16px;
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            color: #eee;
            transition: all 0.2s;
        }
        .channel-btn:focus, .channel-btn:hover {
            background: #00d4ff;
            color: #000;
            outline: none;
            font-weight: bold;
            padding-left: 28px;
        }
        #player-wrapper {
            flex: 1;
            height: 100%;
            background: #000;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <div id="title">SASHA TV</div>
        <div id="channel-list">Cargando canales...</div>
    </div>
    <div id="player-wrapper">
        <video id="video" controls autoplay playsinline></video>
    </div>
</div>

<script>
    // Enlace exacto con corsproxy para bypass de CORS
    const m3uUrl = './lista.m3u.m3u';
    const video = document.getElementById('video');
    const listContainer = document.getElementById('channel-list');
    let hls = new Hls();

    function playStream(url) {
        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(() => {});
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadedmetadata', () => {
                video.play().catch(() => {});
            });
        }
    }

    fetch(m3uUrl)
        .then(res => {
            if (!res.ok) throw new Error('Error al conectar');
            return res.text();
        })
        .then(data => {
            listContainer.innerHTML = '';
            const lines = data.split('\n');
            let currentName = '';

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const parts = line.split(',');
                    currentName = parts[parts.length - 1];
                } else if (line.startsWith('http')) {
                    if (currentName) {
                        const btn = document.createElement('button');
                        btn.className = 'channel-btn';
                        btn.innerText = currentName;
                        const stream = line;
                        btn.onclick = () => playStream(stream);
                        listContainer.appendChild(btn);
                        currentName = '';
                    }
                }
            });

            // Dar foco al primer canal para control remoto
            const firstBtn = listContainer.querySelector('.channel-btn');
            if (firstBtn) firstBtn.focus();
        })
        .catch(err => {
            listContainer.innerText = 'Error al cargar lista de canales.';
        });
</script>

</body>
</html>
