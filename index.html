<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sasha TV</title>
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100vw; height: 100vh; background: #000; overflow: hidden; font-family: sans-serif; color: #fff; }
        #app { display: flex; width: 100%; height: 100%; }
        #sidebar { width: 320px; height: 100%; background: #141414; border-right: 1px solid #222; overflow-y: auto; }
        #title { padding: 20px; font-weight: bold; font-size: 18px; background: #202020; text-align: center; color: #00d4ff; }
        #channel-list { list-style: none; }
        .channel-btn { padding: 15px 20px; border-bottom: 1px solid #222; cursor: pointer; font-size: 15px; display: block; width: 100%; text-align: left; background: none; color: #fff; border: none; }
        .channel-btn:focus, .channel-btn:hover { background: #00d4ff; color: #000; outline: none; font-weight: bold; }
        #player-container { flex: 1; height: 100%; background: #000; }
    </style>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <div id="title">SASHA TV</div>
        <div id="channel-list">Cargando lista...</div>
    </div>
    <div id="player-container"></div>
</div>

<script>
    const m3uUrl = 'https://m3u4u.com/m3u/799g21y2zksw8396nkz8';
    
    let player = new Clappr.Player({
        parentId: "#player-container",
        width: '100%',
        height: '100%',
        autoPlay: true
    });

    // Carga mediante proxy alternativo
    fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(m3uUrl))
        .then(res => res.text())
        .then(data => {
            const listContainer = document.getElementById('channel-list');
            listContainer.innerHTML = '';
            
            const lines = data.split('\n');
            let currentName = '';

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const parts = line.split(',');
                    currentName = parts[parts.length - 1];
                } else if (line.startsWith('http')) {
                    if (currentName) {
                        const btn = document.createElement('button');
                        btn.className = 'channel-btn';
                        btn.innerText = currentName;
                        const stream = line;
                        btn.onclick = () => player.load(stream);
                        listContainer.appendChild(btn);
                        currentName = '';
                    }
                }
            });
        })
        .catch(() => {
            document.getElementById('channel-list').innerText = 'Error al conectar con la lista.';
        });
</script>

</body>
</html>
