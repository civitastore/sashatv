<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sasha TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        #app {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        #sidebar {
            width: 320px;
            height: 100%;
            background: #121212;
            border-right: 2px solid #222;
            display: flex;
            flex-direction: column;
        }
        #title {
            padding: 15px;
            font-weight: bold;
            font-size: 20px;
            background: #1e1e1e;
            text-align: center;
            color: #00d4ff;
            letter-spacing: 1px;
        }
        #category-select {
            width: 90%;
            margin: 10px auto;
            padding: 10px;
            background: #222;
            color: #00d4ff;
            border: 1px solid #333;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }
        #category-select:focus {
            border-color: #00d4ff;
            background: #333;
        }
        #channel-list {
            flex: 1;
            overflow-y: auto;
        }
        .channel-btn {
            padding: 16px 20px;
            border: none;
            border-bottom: 1px solid #222;
            cursor: pointer;
            font-size: 15px;
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            color: #eee;
            transition: all 0.2s;
        }
        .channel-btn:focus, .channel-btn:hover {
            background: #00d4ff;
            color: #000;
            outline: none;
            font-weight: bold;
            padding-left: 28px;
        }
        #player-wrapper {
            flex: 1;
            height: 100%;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <div id="title">SASHA TV</div>
        <select id="category-select" onchange="filterChannels()">
            <option value="ALL">Todas las categorías</option>
        </select>
        <div id="channel-list">Cargando canales...</div>
    </div>
    <div id="player-wrapper">
        <video id="video" controls autoplay playsinline></video>
    </div>
</div>

<script>
    const m3uUrl = './lista.m3u.m3u';
    const video = document.getElementById('video');
    const listContainer = document.getElementById('channel-list');
    const categorySelect = document.getElementById('category-select');
    let hls = null;
    let allChannels = [];

    function playStream(url) {
        if (hls) {
            hls.destroy();
            hls = null;
        }

        if (Hls.isSupported()) {
            hls = new Hls({ enableWorker: true, lowLatencyMode: true });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(e => console.log(e));
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                    else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
                    else hls.destroy();
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play().catch(e => console.log(e));
        }
    }

    function renderChannels(channels) {
        listContainer.innerHTML = '';
        channels.forEach(ch => {
            const btn = document.createElement('button');
            btn.className = 'channel-btn';
            btn.innerText = ch.name;
            btn.onclick = () => playStream(ch.url);
            listContainer.appendChild(btn);
        });

        const firstBtn = listContainer.querySelector('.channel-btn');
            if (firstBtn) firstBtn.focus();
    }

    function filterChannels() {
        const selectedGroup = categorySelect.value;
        if (selectedGroup === 'ALL') {
            renderChannels(allChannels);
        } else {
            const filtered = allChannels.filter(ch => ch.group === selectedGroup);
            renderChannels(filtered);
        }
    }

    fetch(m3uUrl)
        .then(res => {
            if (!res.ok) throw new Error('Error al conectar');
            return res.text();
        })
        .then(data => {
            const lines = data.split('\n');
            let currentName = '';
            let currentGroup = 'General';
            const categoriesSet = new Set();

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    // Extraer nombre del canal
                    const parts = line.split(',');
                    currentName = parts[parts.length - 1];

                    // Extraer categoría (group-title)
                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    if (groupMatch && groupMatch[1]) {
                        currentGroup = groupMatch[1];
                    } else {
                        currentGroup = 'Otros';
                    }
                    categoriesSet.add(currentGroup);
                } else if (line.startsWith('http')) {
                    if (currentName) {
                        allChannels.push({
                            name: currentName,
                            group: currentGroup,
                            url: line
                        });
                        currentName = '';
                    }
                }
            });

            // Llenar el desplegable de categorías
            Array.from(categoriesSet).sort().forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                categorySelect.appendChild(opt);
            });

            // Mostrar todos inicialmente
            renderChannels(allChannels);
        })
        .catch(err => {
            listContainer.innerText = 'Error al cargar lista de canales.';
        });
</script>

</body>
</html>
